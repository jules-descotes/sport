name: CI — Sport

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "True"
          STORAGE_BACKEND: local

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Le lint porte les règles de React 19 — un `setState` dans un effet,
      # une ref lue pendant le rendu. Ce sont des bugs de rendu, pas du style,
      # et ils ne se voient pas au build.
      - name: Lint
        run: cd frontend && npm run lint

      # Ce qui ne se vérifie pas à l'œil : la file hors ligne (une notation
      # jamais renvoyée ne laisse aucune trace), le cache de prévision (qui
      # décide si une requête part), et les règles de calcul. IndexedDB est
      # réel, pas bouchonné.
      - name: Tests du front
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api-sport.atelier-okomi.fr/api/v1"
          NEXT_PUBLIC_SITE_URL: "https://sport.atelier-okomi.fr"
          NEXT_PUBLIC_APP_NAME: Sport

      # Le mode séance ne se teste pas ailleurs : un minuteur est un objet du
      # navigateur — un intervalle, une horloge, une hydratation, un geste
      # utilisateur. Chromium sans interface suffit ici ; le projet `iphone`
      # (WebKit) se lance à la main, il est trop capricieux pour une CI qu'on
      # veut croire.
      - name: Installer Chromium pour Playwright
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Tests navigateur
        run: cd frontend && npm run test:e2e
        env:
          CI: "true"

      - name: Traces des tests navigateur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
